services:
  slide-service:
    build: .
    ports:
      - "6312:6312"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/slide_service
      - REDIS_URL=redis://redis:6379/1
      - AUTH_ENABLED=false
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/app/data
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - slide-data:/app/data

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slide_service
    ports:
      - "5462:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PostgreSQL — test database (pytest only, never the app)
  #
  # Deliberately a SEPARATE server from `db` above: it mirrors the CI container,
  # where the gitops archetype runs a stock postgres:18 with POSTGRES_USER=ci_test
  # — which makes ci_test a SUPERUSER. Pointing pytest at the app's restricted
  # role would diverge from CI on anything needing elevated rights.
  #
  # tmpfs, no named volume: test data is worthless by definition, and a persisted
  # volume is how a stale schema survives across model changes.
  slide_service_test_postgres:
    image: postgres:18-alpine
    container_name: slide_service_test_postgres
    environment:
      # Throwaway local-test credentials, not a secret. Must match the local
      # default in tests/conftest.py and scripts/ci-local.sh.
      POSTGRES_USER: ci_test
      POSTGRES_PASSWORD: ci_test_password_secure # pragma: allowlist secret
      POSTGRES_DB: slide_service_ci
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5473:5432"
    # postgres:18 keeps data in a versioned subdir (/var/lib/postgresql/18/docker)
    # and REFUSES TO START if you mount over the old /var/lib/postgresql/data path.
    # The image's own guidance is a single mount at /var/lib/postgresql.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_test -d slide_service_ci"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6396:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  slide-data:
